name: Keep Supabase Awake

on:
  schedule:
    # Runs at 12:00 PM UTC every 3 days (well within Supabase's 7-day limit)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Inventory
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13Y2VndnJ4d3Z0cGRseW9yaHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzU3MDgsImV4cCI6MjEwNjA1MTcwOH0.zRg_eEGHPVXXke13TYNYb6NmpoZc7LgYpzZM1z24HF8" \
            "https://mwcegvrxwvtpdlyorhpr.supabase.co/rest/v1/inventory?select=id&limit=1")
          echo "Supabase responded with HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Received unexpected status code $STATUS"
            exit 1
          fi
